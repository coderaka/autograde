description = "批量批改 submissions/ 下所有未批改的作业"

prompt = """
请执行批量批改流程：

## 步骤

1. **确认作业**: 先询问我要批改哪次作业（如 hw1）。如果 submissions/ 下只有一个子目录，直接使用它。
2. **扫描提交目录**: 列出 submissions/{作业名}/ 目录下所有文件（PDF、图片或 Markdown）
3. **检查已完成**: 检查 results/{作业名}/ 目录中已有哪些批改结果（.md 文件），找出尚未批改的提交
4. **读取评分标准**: 用 view_file 读取 rubrics/{作业名}/rubric.md
5. **分批处理**: 每批处理 5 份作业
   - 对每份作业：
     a. 用 view_file 读取学生提交文件
     b. 逐题对照评分标准批改
     c. 生成批改报告，用 write_to_file 保存到 results/{作业名}/{姓名}_{学号}.md
   - 每批完成后，输出进度报告：

   ```
   📊 批改进度: [已完成]/[总数]
   本批次结果:
   | 学生 | 总分 |
   |------|------|
   | ...  | ...  |
   ```

   - 等待我确认后再继续下一批

6. **全部完成后**: 输出最终汇总

请开始扫描并报告待批改的作业数量。
"""
