description = "批改单份作业。用法: /grade submissions/hw1/张三_12345.pdf"

prompt = """
请批改以下学生提交的作业。

## 评分标准

请先用 view_file 工具读取评分标准文件 rubrics/hw1/rubric.md。

## 学生提交

请用 view_file 工具读取以下学生提交的 PDF 文件: {{args}}

## 批改流程

1. 仔细阅读学生的 PDF 提交（包括手写内容）
2. 对照评分标准中的每个评分点，逐项检查学生的解答
3. 对每道题：
   - 逐步跟踪学生的推导过程
   - 标注正确的步骤 ✅ 和有问题的步骤 ❌
   - 对于错误，解释错在哪里、应该怎么做
   - 根据评分点表给出该题得分
4. 给出总分和整体评语
5. 将批改报告用 write_to_file 保存到 results/hw1/ 目录下
   - 文件名规则：从 PDF 文件名中提取学号和姓名，格式为 {姓名}_{学号}.md
   - 例如：submissions/hw1/521030910396何明鸿_xxx.pdf → results/hw1/何明鸿_521030910396.md

请开始批改。
"""
