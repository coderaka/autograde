description = "汇总已完成的批改结果，生成成绩表"

prompt = """
请汇总批改结果：

1. 先确认要汇总哪次作业（如 hw1）。如果 results/ 下只有一个子目录，直接使用它。
2. 读取 results/{作业名}/ 目录下所有 .md 批改报告
3. 从每份报告中提取：学生姓名、学号、各题得分、总分
4. 生成汇总表，格式：

```markdown
# [课程名] [作业名] 成绩汇总

| 姓名 | 学号 | Q1 | Q2 | ... | 总分 |
|------|------|----|----|-----|------|
| ...  | ...  | .. | .. | ... | ...  |

## 统计信息
- 提交人数: X
- 平均分: X.X
- 最高分: X
- 最低分: X
- 中位数: X
- 标准差: X.X
- 分数分布: [0-60): X人, [60-70): X人, [70-80): X人, [80-90): X人, [90-100]: X人
```

5. 将汇总表用 write_to_file 保存到 results/{作业名}/grades_summary.md
6. 同时生成 CSV 格式成绩单，保存到 results/{作业名}/grades.csv
   - 格式: 学号,姓名,Q1,Q2,...,总分
"""
